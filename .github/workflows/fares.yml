name: Refresh Kyushu toll junctions

on:
  schedule:
    - cron: '15 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Export Kyushu motorway junctions
        run: |
          curl -fsSL -o /tmp/kyushu.osm.pbf https://download.geofabrik.de/asia/japan/kyushu-latest.osm.pbf
          osmium tags-filter /tmp/kyushu.osm.pbf n/highway=motorway_junction -o /tmp/junctions.osm.pbf
          osmium export /tmp/junctions.osm.pbf -o /tmp/kyushu-ic.geojsonl -f geojsonseq
      - name: Rebuild toll table
        env:
          OSM_JUNCTIONS: /tmp/kyushu-ic.geojsonl
        run: node scripts/build-tolls.mjs
      - name: Commit toll data on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tolls-kyushu.json
          if git diff --cached --quiet; then
            echo "No toll changes"
          else
            git commit -m "Update bundled Kyushu toll junctions"
            git push origin HEAD:main
          fi
