name: Crawl charger spots

on:
  schedule:
    # 03:40 JST. Daily, not every five days: Actions does not spend a user
    # credit, and each run waits at least one second between requests.
    - cron: '40 18 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Detail pages to fetch this run'
        default: '200'

permissions:
  contents: write

concurrency:
  group: crawl-spots
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the next batch of EVsmart spot pages
        env:
          SPOT_BATCH: ${{ github.event.inputs.batch || '200' }}
        run: node scripts/crawl-spots.mjs
      - name: Commit spot data on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spots
          if git diff --cached --quiet; then
            echo "No spot changes"
          else
            git commit -m "Update bundled charger spots"
            git push origin HEAD:main
          fi
