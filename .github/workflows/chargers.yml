name: Build Japan charger data

on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Build charger JSON
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: node scripts/build-chargers.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chargers-jp.json data/chargers-jp-ac.json
          if git diff --cached --quiet; then
            echo "No charger data changes"
          else
            git commit -m "Update bundled Japan charger data"
            git push
          fi
